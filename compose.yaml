services:
  kamino-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: kelvara-kamino-monitor:latest
    restart: unless-stopped
    init: true
    ports:
      - "${KELVARA_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      SOLANA_RPC_URL: "${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}"
      KAMINO_API_URL: "${KAMINO_API_URL:-https://api.kamino.finance}"
      MONITORED_WALLET: "${MONITORED_WALLET:-}"
      POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-60000}"
      KAMINO_EXPECTED_VAULT_ADMIN: "${KAMINO_EXPECTED_VAULT_ADMIN:-}"
      KAMINO_EXPECTED_PENDING_ADMIN: "${KAMINO_EXPECTED_PENDING_ADMIN:-}"
      KAMINO_EXPECTED_ALLOCATION_ADMIN: "${KAMINO_EXPECTED_ALLOCATION_ADMIN:-}"
      KAMINO_ANNOUNCEMENTS_JSON: "${KAMINO_ANNOUNCEMENTS_JSON:-[]}"
      KAMINO_ANNOUNCEMENTS_REVIEWED_AT: "${KAMINO_ANNOUNCEMENTS_REVIEWED_AT:-}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
