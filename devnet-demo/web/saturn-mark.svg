<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Saturn Earn</title>
  <desc id="desc">A luminous ringed planet made from flowing orbital bands</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="57" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16181d"/><stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="planet" x1="20" y1="17" x2="45" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9ff72"/><stop offset=".48" stop-color="#78e7b0"/><stop offset="1" stop-color="#8c7cff"/>
    </linearGradient>
    <linearGradient id="ring" x1="9" y1="44" x2="57" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9a7cff"/><stop offset=".5" stop-color="#d9ff72"/><stop offset="1" stop-color="#69dfba"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  </defs>
  <rect width="64" height="64" rx="17" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="14" fill="url(#planet)" filter="url(#glow)"/>
  <path d="M13 26c5-8 18-13 31-10" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="2" stroke-linecap="round"/>
  <path d="M8.5 38C20 46 44 39.5 56 27.5" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
</svg>
